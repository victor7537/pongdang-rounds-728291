<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex, nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>퐁당 가맹점 방문일지</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Noto+Sans+KR:wght@400;500;700&display=swap">
<style>
/* 레이아웃: 한 줄에 한 매장인 표형 목록. 위에 지역 탭과 열 이름을 고정하고, 행을 누르면 오늘 기록 입력칸과 상세가 펼쳐진다. */
:root {
  --bg: #EFF3F1;
  --surface: #FFFFFF;
  --ink: #16211E;
  --muted: #55655F;
  --line: #D8E0DC;
  --line-strong: #A9B7B1;
  --accent: #0B6B5A;
  --accent-ink: #FFFFFF;
  --accent-soft: #DDEFE9;
  --warn: #7F4400;
  --warn-bg: #FFEACB;
  --warn-dot: #D9A22B;
  --bad: #A3251C;
  --bad-bg: #FCE3E0;
  --font-body: "Noto Sans KR", system-ui, -apple-system, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
  --font-num: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0E1514;
    --surface: #17211F;
    --ink: #E7EFEC;
    --muted: #9CB0A9;
    --line: #2A3A36;
    --line-strong: #4A605A;
    --accent: #4CC2A8;
    --accent-ink: #0A1D19;
    --accent-soft: #1A3731;
    --warn: #F4BE70;
    --warn-bg: #3A2B12;
    --warn-dot: #D9A22B;
    --bad: #FF9C92;
    --bad-bg: #411D1A;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0E1514;
  --surface: #17211F;
  --ink: #E7EFEC;
  --muted: #9CB0A9;
  --line: #2A3A36;
  --line-strong: #4A605A;
  --accent: #4CC2A8;
  --accent-ink: #0A1D19;
  --accent-soft: #1A3731;
  --warn: #F4BE70;
  --warn-bg: #3A2B12;
  --warn-dot: #D9A22B;
  --bad: #FF9C92;
  --bad-bg: #411D1A;
  color-scheme: dark;
}
[hidden] { display: none !important; }
html { -webkit-text-size-adjust: 100%; }
* { box-sizing: border-box; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font: 400 15px/1.5 var(--font-body);
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 20px 56px;
}
body::before {
  content: "";
  position: fixed;
  inset: 0 0 auto;
  height: env(safe-area-inset-top, 0px);
  z-index: 10;
  background: var(--bg);
}
button, input, select, textarea { font: inherit; color: inherit; }
button:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.wrap { max-width: 760px; margin: 0 auto; }

header h1 { margin: 0; font-size: 22px; line-height: 1.25; font-weight: 700; letter-spacing: -0.01em; }
.dayline { margin: 4px 0 0; color: var(--muted); font-size: 13px; }
.dayline b { color: var(--ink); font-weight: 700; font-variant-numeric: tabular-nums; }
.prog { display: grid; grid-template-columns: auto 1fr auto; align-items: center; gap: 10px; margin-top: 14px; }
.prog span { font: 500 13px var(--font-num); font-variant-numeric: tabular-nums; }
.track { height: 6px; border-radius: 3px; background: var(--line); overflow: hidden; }
.track u { display: block; height: 100%; width: 0; background: var(--accent); text-decoration: none; transition: width .25s ease; }
.link { border: 0; background: none; color: var(--muted); font-size: 12.5px; padding: 8px 0 8px 6px; cursor: pointer; text-decoration: underline; text-underline-offset: 3px; }

.sync { display: flex; align-items: center; gap: 8px; margin-top: 12px; padding: 7px 8px 7px 12px; border: 1px solid var(--line); border-radius: 10px; background: var(--surface); font-size: 12.5px; }
.sync .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--line-strong); flex: none; }
.sync[data-s="ok"] .dot { background: var(--accent); }
.sync[data-s="pending"] .dot { background: var(--warn-dot); }
.sync[data-s="error"] .dot { background: var(--bad); }
.sync .t { flex: 1; min-width: 0; color: var(--muted); line-height: 1.4; }
.sync button { flex: none; height: 30px; padding: 0 10px; border: 1px solid var(--line); border-radius: 8px; background: var(--bg); font-size: 12.5px; font-weight: 500; cursor: pointer; }
.who { display: flex; align-items: center; gap: 8px; margin-top: 8px; font-size: 13px; color: var(--muted); }
.who input { flex: 1; min-width: 0; height: 40px; border: 1px solid var(--line); border-radius: 10px; background: var(--surface); padding: 0 12px; font-size: 16px; }

.tools { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 8px; margin-top: 14px; }
.tools input, .tools select {
  height: 44px; border: 1px solid var(--line); background: var(--surface);
  border-radius: 10px; padding: 0 12px; font-size: 16px; min-width: 0;
}
.tools select { padding-right: 8px; }
.filters { display: flex; gap: 6px; margin-top: 10px; overflow-x: auto; scrollbar-width: none; padding-bottom: 2px; }
.filters::-webkit-scrollbar { display: none; }
.filters .chip { flex: none; }

.chip {
  display: inline-flex; align-items: center; min-height: 34px; padding: 0 12px;
  border: 1px solid var(--line); border-radius: 999px; background: var(--surface);
  font-size: 13.5px; font-weight: 500; white-space: nowrap; cursor: pointer;
}
.chip .ct { font: 400 11.5px var(--font-num); margin-left: 6px; opacity: .65; }
.chip[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.chip[aria-pressed="true"] .ct { opacity: .85; }

.sticky { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--bg); margin-top: 14px; }
.regions { display: flex; gap: 6px; overflow-x: auto; padding: 6px 0 8px; scrollbar-width: none; }
.regions::-webkit-scrollbar { display: none; }
.regions .chip { flex: none; }

.thead, .main { --c1: 62px; --c2: 74px; }
.thead {
  display: grid; grid-template-columns: 48px minmax(0, 1fr) calc(var(--c1) + 8px) calc(var(--c2) + 8px);
  padding-right: 12px; align-items: end;
  background: var(--surface); border: 1px solid var(--line); border-radius: 10px 10px 0 0;
  padding-block: 7px; font-size: 11.5px; font-weight: 500; color: var(--muted); line-height: 1.25;
}
.thead .nm { grid-column: 2; }
.thead .r { text-align: right; padding-left: 8px; }
.thead em { display: block; font-style: normal; font-size: 10.5px; opacity: .85; }

.list { background: var(--surface); border: 1px solid var(--line); border-top: 0; border-radius: 0 0 10px 10px; overflow: hidden; }
.grp {
  display: flex; justify-content: space-between; align-items: baseline;
  padding: 7px 12px; background: var(--accent-soft); border-bottom: 1px solid var(--line);
  font-size: 12.5px; color: var(--ink);
}
.grp b { font-weight: 700; }
.grp span { font: 400 11.5px var(--font-num); color: var(--muted); }

.store { border-bottom: 1px solid var(--line); }
.store:last-child { border-bottom: 0; }
.rowline { display: grid; grid-template-columns: 48px minmax(0, 1fr); }
.chk { width: 48px; height: 56px; border: 0; background: none; display: grid; place-items: center; cursor: pointer; padding: 0; }
.chk i { display: block; position: relative; width: 24px; height: 24px; border-radius: 50%; border: 2px solid var(--line-strong); }
.chk[aria-pressed="true"] i { background: var(--accent); border-color: var(--accent); }
.chk[aria-pressed="true"] i::after {
  content: ""; position: absolute; left: 6px; top: 2px; width: 6px; height: 11px;
  border: solid var(--accent-ink); border-width: 0 2.5px 2.5px 0; transform: rotate(45deg);
}
.main {
  display: grid; grid-template-columns: minmax(0, 1fr) var(--c1) var(--c2); column-gap: 8px; align-items: start;
  width: 100%; border: 0; background: none; text-align: left; cursor: pointer;
  padding: 10px 12px 11px 0;
}
.main > * { min-width: 0; }
.nm b { display: inline; font-size: 16.5px; line-height: 1.3; font-weight: 700; letter-spacing: -0.01em; }
.nm .chev { display: inline-block; vertical-align: -1px; margin-left: 4px; color: var(--muted); transition: transform .15s ease; }
.store.open .chev { transform: rotate(90deg); }
.nm small { display: block; margin-top: 1px; font-size: 12.5px; color: var(--muted); }
.v { text-align: right; font: 500 15px/1.3 var(--font-num); font-variant-numeric: tabular-nums; padding-top: 2px; }
.v small { font: 400 11px var(--font-body); margin-left: 1px; color: var(--muted); }
.bar { display: block; height: 4px; border-radius: 2px; background: var(--line); margin-top: 5px; overflow: hidden; }
.bar u { display: block; height: 100%; background: var(--accent); text-decoration: none; }
.tags { grid-column: 1 / -1; display: flex; flex-wrap: wrap; align-items: center; gap: 4px 5px; margin-top: 7px; }
.tag { display: inline-block; padding: 1px 7px; border-radius: 4px; font-size: 11.5px; font-weight: 700; line-height: 1.5; }
.tag.bad { background: var(--bad-bg); color: var(--bad); }
.tag.warn { background: var(--warn-bg); color: var(--warn); }
.tag.ok { background: var(--accent-soft); color: var(--accent); }
.until { font-size: 12px; font-variant-numeric: tabular-nums; color: var(--muted); margin-left: 2px; }
.pv {
  grid-column: 1 / -1; margin-top: 6px; font-size: 13px; line-height: 1.45; color: var(--muted);
  display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
}
.pv.mine { color: var(--ink); }
.store.open .pv { display: none; }
.store.done .nm b { color: var(--accent); }
.store.open { background: color-mix(in srgb, var(--accent-soft) 35%, var(--surface)); }

.detail { padding: 2px 14px 16px 14px; border-top: 1px dashed var(--line); }
.detail h3 { margin: 14px 0 6px; font-size: 11.5px; font-weight: 700; letter-spacing: 0.04em; color: var(--muted); }
.log { display: grid; gap: 8px; padding: 10px 12px; border: 1px solid var(--line-strong); border-radius: 10px; background: var(--surface); }
.logrow { display: flex; justify-content: space-between; align-items: center; gap: 8px; font-size: 13px; }
.logrow .vs { font-weight: 700; }
.logrow .vs.on { color: var(--accent); }
.logrow label { display: flex; align-items: center; gap: 6px; color: var(--muted); }
.logrow input { height: 36px; border: 1px solid var(--line); border-radius: 8px; background: var(--bg); padding: 0 6px; font-size: 16px; }
.log textarea { width: 100%; min-height: 84px; resize: vertical; border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; font-size: 16px; line-height: 1.45; background: var(--bg); }
.notes { margin: 0; padding: 0; list-style: none; display: grid; gap: 6px; }
.notes li { position: relative; padding-left: 14px; font-size: 14.5px; line-height: 1.5; }
.notes li::before { content: ""; position: absolute; left: 1px; top: 0.7em; width: 6px; height: 2px; background: var(--accent); }
.facts { margin: 0; display: grid; grid-template-columns: repeat(auto-fit, minmax(148px, 1fr)); gap: 10px 14px; }
.facts div { min-width: 0; }
.facts dt { font-size: 11.5px; color: var(--muted); }
.facts dd { margin: 0; font-size: 14.5px; overflow-wrap: anywhere; }
.facts .wide { grid-column: 1 / -1; }
.money { margin: 0; display: grid; grid-template-columns: 1fr auto; gap: 7px 12px; padding: 10px 12px; background: var(--accent-soft); border-radius: 8px; }
.money dt { font-size: 12.5px; color: var(--muted); align-self: center; }
.money dd { margin: 0; text-align: right; font: 500 13.5px var(--font-num); font-variant-numeric: tabular-nums; overflow-wrap: anywhere; }
.money dd small { font: 400 11px var(--font-body); color: var(--muted); }

.empty { padding: 28px 16px; text-align: center; color: var(--muted); }
footer { margin-top: 16px; font-size: 12px; line-height: 1.6; color: var(--muted); }
.toast {
  position: fixed; left: 50%; transform: translateX(-50%); z-index: 20; max-width: calc(100% - 32px);
  bottom: calc(20px + env(safe-area-inset-bottom, 0px)); padding: 10px 14px; border-radius: 10px;
  background: var(--ink); color: var(--bg); font-size: 13px; text-align: center;
}

@media (max-width: 359px) {
  .thead, .main { --c1: 54px; --c2: 66px; }
  .nm b { font-size: 15.5px; }
}
@media (prefers-reduced-motion: reduce) {
  .track u, .nm .chev { transition: none; }
}
</style>

<div class="wrap">
  <header>
    <h1>퐁당 가맹점 방문일지</h1>
    <p class="dayline" id="dayline"></p>
    <div class="prog">
      <span id="progText">방문 0 / 0</span>
      <div class="track" aria-hidden="true"><u id="progFill"></u></div>
      <button class="link" id="reset" type="button">오늘 기록 지우기</button>

    </div>
    <label class="who">작성자<input id="author" type="text" placeholder="이름 (일지에 함께 기록됩니다)" autocomplete="name" maxlength="20"></label>
  </header>

  <div class="tools">
    <input id="q" type="search" placeholder="매장·메모 검색" autocomplete="off" aria-label="검색">
    <select id="sort" aria-label="정렬">
      <option value="region">지역별</option>
      <option value="num">번호순</option>
      <option value="avg">평당 월평균 높은순</option>
      <option value="s26">2026 매출 높은순</option>
      <option value="end">계약종료 임박순</option>
    </select>
  </div>
  <div class="filters" id="filters" role="group" aria-label="모아보기"></div>

  <div class="sticky">
    <div class="regions" id="regions" role="group" aria-label="지역"></div>
    <div class="thead" aria-hidden="true">
      <span class="nm">상호</span>
      <span class="r">2026 매출<em>10.31까지</em></span>
      <span class="r">평당 월평균<em>8~10월·만원</em></span>
    </div>
  </div>
  <div class="list" id="list"></div>

  <footer id="foot"></footer>
</div>
<div class="toast" id="toast" role="status" hidden></div>

      '<dt>평당매출 (2026 누적)</dt><dd>' + d.pys.toLocaleString("ko-KR") + '<small>원/평</small></dd>';
    if (FULL) money += '<dt>임대료 (공급가 기준)</dt><dd>' + (d.rent === "자가" ? "자가" : d.rent + '<small>만원</small>') + '</dd>';
    return logBoxHTML(d) + notes + '<h3>기본 정보</h3><dl class="facts">' + facts + '</dl><h3>매출' + (FULL ? "·임대료" : "") + '</h3><dl class="money">' + money + '</dl>';
  }

  function pvHTML(d, e) {
    var mine = e && e.m;
    var text = mine ? "오늘 메모 · " + e.m : d.notes.slice(0, 2).join(" · ");
    return text ? '<span class="pv' + (mine ? " mine" : "") + '">' + esc(text) + '</span>' : "";
  }

  function rowHTML(d) {
    var e = log.entries[d.n] || {}, open = !!state.open[d.n], done = !!e.v;
    return '<article class="store' + (open ? " open" : "") + (done ? " done" : "") + '" data-n="' + d.n + '">' +
      '<div class="rowline">' +
        '<button type="button" class="chk" aria-pressed="' + done + '" aria-label="' + esc(d.name) + ' 방문 완료 표시"><i></i></button>' +
        '<button type="button" class="main" aria-expanded="' + open + '" aria-controls="dt' + d.n + '">' +
          '<span class="nm"><b>' + esc(d.name) + '</b>' +
            '<svg class="chev" viewBox="0 0 16 16" width="13" height="13" aria-hidden="true"><path d="M5.5 3.5 10 8l-4.5 4.5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>' +
            '<small>' + d.region + ' · ' + d.py + '평 · ' + d.fl + '층</small></span>' +
          '<span class="v">' + eok(d.s26) + '</span>' +
          '<span class="v">' + man1(d.avg) + '<i class="bar"><u style="width:' + Math.max(3, Math.round(d.avg / MAXAVG * 100)) + '%"></u></i></span>' +
          '<span class="tags">' + tagsFor(d, e) + '</span>' +
          pvHTML(d, e) +
        '</button>' +
      '</div>' +
      '<div class="detail" id="dt' + d.n + '"' + (open ? "" : " hidden") + '>' + detailHTML(d) + '</div>' +
    '</article>';
  }

  function visible() {
    var q = state.q.trim().toLowerCase();
    return DATA.filter(function (d) {
      if (state.region !== "전체" && d.region !== state.region) return false;
      if (q) {
        var hay = (d.name + " " + d.region + " " + d.notes.join(" ") + (FULL ? " " + d.acq : "")).toLowerCase();
        if (hay.indexOf(q) < 0) return false;
      }
      for (var i = 0; i < FILTERS.length; i++) if (state.filters[FILTERS[i].id] && !FILTERS[i].test(d)) return false;
      return true;
    }).sort(SORTS[state.sort]);
  }

  function render() {
    var rows = visible();
    if (!rows.length) {
      elList.innerHTML = '<div class="empty">조건에 맞는 매장이 없습니다.<br><button type="button" class="link" id="clear">조건 모두 지우기</button></div>';
      updateProgress();
      return;
    }
    var grouped = state.sort === "region" && state.region === "전체";
    var html = "", last = null;
    rows.forEach(function (d) {
      if (grouped && d.region !== last) {
        last = d.region;
        var g = rows.filter(function (x) { return x.region === d.region; });
        var dn = g.filter(function (x) { return isDone(x.n); }).length;
        html += '<div class="grp"><b>' + d.region + '</b><span>' + g.length + '곳 · 방문 ' + dn + '/' + g.length + '</span></div>';
      }
      html += rowHTML(d);
    });
    elList.innerHTML = html;
    updateProgress();
  }

  function updateProgress() {
    var total = DATA.length, done = DATA.filter(function (d) { return isDone(d.n); }).length;
    document.getElementById("progText").textContent = "방문 " + done + " / " + total;
    document.getElementById("progFill").style.width = Math.round(done / total * 100) + "%";
  }
  function renderHeader() {
    document.getElementById("dayline").innerHTML = '<b>' + bizLabel() + '</b> 방문일지 · 매일 오전 5시에 새로 시작합니다';
    document.getElementById("foot").textContent = "방문 기록은 매일 오전 5시에 초기화됩니다." + (SYNC.url ? " 초기화 전에 입력한 내용은 이미 드라이브 일지로 전송됩니다." : "");
  }

  var toastTimer;
  function toast(msg) {
    var t = document.getElementById("toast");
    t.textContent = msg; t.hidden = false;
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { t.hidden = true; }, 3500);
  }

  /* ---------- 새 날 확인(오전 5시) ---------- */
  function checkRollover() {
    var d = bizDay();
    if (log.day === d) return;
    log.day = d; log.entries = {}; state.open = {};
    persist();
    renderHeader(); render();
    toast("새 방문일지가 시작되었습니다");
  }
  setInterval(checkRollover, 30000);
  document.addEventListener("visibilitychange", function () { if (!document.hidden) { checkRollover(); flush(); } });
  window.addEventListener("online", flush);
  setInterval(function () { if (queue.length) flush(); }, 60000);

  /* ---------- 이벤트 ---------- */
  function storeOf(el) { var s = el.closest(".store"); return s ? Number(s.dataset.n) : 0; }

  elList.addEventListener("click", function (e) {
    if (e.target.id === "clear") {
      state.region = "전체"; state.q = ""; state.filters = {};
      document.getElementById("q").value = "";
      syncChips(); render();
      return;
    }
    var chk = e.target.closest(".chk"), main = e.target.closest(".main");
    if (chk) {
      var n = storeOf(chk), en = entry(n);
      if (en.v) { en.v = 0; en.t = ""; } else { en.v = 1; en.t = nowHM(); }
      persist(); enqueue(n); render();
      return;
    }
    if (main) {
      var st = main.closest(".store"), id = Number(st.dataset.n), willOpen = !state.open[id];
      if (willOpen) state.open[id] = true; else delete state.open[id];
      st.classList.toggle("open", willOpen);
      main.setAttribute("aria-expanded", String(willOpen));
      st.querySelector(".detail").hidden = !willOpen;
    }
  });
  elList.addEventListener("input", function (e) {
    if (e.target.dataset.act !== "memo") return;
    var n = storeOf(e.target);
    entry(n).m = e.target.value;
    persist();
    clearTimeout(memoTimers[n]);
    memoTimers[n] = setTimeout(function () { enqueue(n); }, 1200);
  });
  elList.addEventListener("change", function (e) {
    var act = e.target.dataset.act, n = storeOf(e.target);
    if (!act || !n) return;
    if (act === "time") { entry(n).t = e.target.value; persist(); enqueue(n); }
    if (act === "memo") {
      clearTimeout(memoTimers[n]); enqueue(n);
      var st = e.target.closest(".store"), d = byN(n), old = st.querySelector(".pv");
      var html = pvHTML(d, log.entries[n]);
      if (old) old.remove();
      if (html) st.querySelector(".main").insertAdjacentHTML("beforeend", html);
    }
  });

  elRegions.addEventListener("click", function (e) {
    var b = e.target.closest("[data-region]");
    if (!b) return;
    state.region = b.dataset.region; syncChips(); render();
  });
  elFilters.addEventListener("click", function (e) {
    var b = e.target.closest("[data-filter]");
    if (!b) return;
    var id = b.dataset.filter;
    if (state.filters[id]) delete state.filters[id]; else state.filters[id] = true;
    syncChips(); render();
  });
  document.getElementById("q").addEventListener("input", function (e) { state.q = e.target.value; render(); });
  document.getElementById("sort").addEventListener("change", function (e) { state.sort = e.target.value; render(); });

  var authorEl = document.getElementById("author");
  authorEl.value = log.author;
  authorEl.addEventListener("change", function () {
    log.author = authorEl.value.trim(); persist();
    Object.keys(log.entries).forEach(function (k) { var en = log.entries[k]; if (en.v || en.m) enqueue(Number(k)); });
  });
  document.getElementById("syncNow").addEventListener("click", function () { sync.s = "pending"; flush(); });

  var resetBtn = document.getElementById("reset"), resetTimer = null;
  resetBtn.addEventListener("click", function () {
    if (!Object.keys(log.entries).length) return;
    if (resetBtn.dataset.armed) {
      Object.keys(log.entries).forEach(function (k) { log.entries[k] = { v: 0, t: "", m: "" }; enqueue(Number(k)); });
      log.entries = {}; persist(); render();
      resetBtn.textContent = "오늘 기록 지우기"; delete resetBtn.dataset.armed; clearTimeout(resetTimer);
    } else {
      resetBtn.dataset.armed = "1"; resetBtn.textContent = "한 번 더 누르면 지웁니다";
      resetTimer = setTimeout(function () { resetBtn.textContent = "오늘 기록 지우기"; delete resetBtn.dataset.armed; }, 3500);
    }
  });

  buildChips(); syncChips(); renderHeader(); renderSync(); render();
  if (queue.length) flush();
})();
</script>

</html>
