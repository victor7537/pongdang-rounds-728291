/* 레이아웃: 한 줄에 한 매장인 표형 목록. 위에 지역 탭과 열 이름을 고정하고, 행을 누르면 상세가 펼쳐진다. */
:root {
  color-scheme: light;
  --bg: #EFF3F1;
  --surface: #FFFFFF;
  --ink: #16211E;
  --muted: #55655F;
  --line: #D8E0DC;
  --line-strong: #A9B7B1;
  --accent: #0B6B5A;
  --accent-ink: #FFFFFF;
  --accent-soft: #DDEFE9;
  --font-body: "Noto Sans KR", system-ui, -apple-system, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
  --font-num: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root {
    color-scheme: dark;
    --bg: #0E1514;
    --surface: #17211F;
    --ink: #E7EFEC;
    --muted: #9CB0A9;
    --line: #2A3A36;
    --line-strong: #4A605A;
    --accent: #4CC2A8;
    --accent-ink: #0A1D19;
    --accent-soft: #1A3731;
  }
}
[hidden] { display: none !important; }
html { -webkit-text-size-adjust: 100%; }
* { box-sizing: border-box; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font: 400 15px/1.5 var(--font-body);
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: max(20px, env(safe-area-inset-top, 0px)) 48px;
}
button, input, select { font: inherit; color: inherit; }
button:focus-visible, input:focus-visible, select:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.wrap { max-width: 760px; margin: 0 auto; }

header h1 { margin: 0; font-size: 22px; line-height: 1.25; font-weight: 700; letter-spacing: -0.01em; }
header p { margin: 4px 0 0; color: var(--muted); font-size: 13px; }
.prog { display: grid; grid-template-columns: auto 1fr auto; align-items: center; gap: 10px; margin-top: 14px; }
.prog span { font: 500 13px var(--font-num); font-variant-numeric: tabular-nums; }
.track { height: 6px; border-radius: 3px; background: var(--line); overflow: hidden; }
.track u { display: block; height: 100%; width: 0; background: var(--accent); text-decoration: none; transition: width .25s ease; }
.link { border: 0; background: none; color: var(--muted); font-size: 12.5px; padding: 8px 0 8px 6px; cursor: pointer; text-decoration: underline; text-underline-offset: 3px; }

.tools { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 8px; margin-top: 16px; }
.tools input, .tools select {
  height: 44px; border: 1px solid var(--line); background: var(--surface);
  border-radius: 10px; padding: 0 12px; font-size: 16px; min-width: 0;
}
.tools select { padding-right: 8px; }
.filters { display: flex; gap: 6px; margin-top: 10px; overflow-x: auto; scrollbar-width: none; padding-bottom: 2px; }
.filters::-webkit-scrollbar { display: none; }
.filters .chip { flex: none; }

.chip {
  display: inline-flex; align-items: center; min-height: 34px; padding: 0 12px;
  border: 1px solid var(--line); border-radius: 999px; background: var(--surface);
  font-size: 13.5px; font-weight: 500; white-space: nowrap; cursor: pointer;
}
.chip .ct { font: 400 11.5px var(--font-num); margin-left: 6px; opacity: .65; }
.chip[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.chip[aria-pressed="true"] .ct { opacity: .85; }

.sticky { position: sticky; top: 0; z-index: 5; background: var(--bg); margin-top: 14px; }
.regions { display: flex; gap: 6px; overflow-x: auto; padding: 6px 0 8px; scrollbar-width: none; }
.regions::-webkit-scrollbar { display: none; }
.regions .chip { flex: none; }

.thead, .main { --c1: 62px; --c2: 74px; }
.thead {
  display: grid; grid-template-columns: 48px minmax(0, 1fr) calc(var(--c1) + 8px) calc(var(--c2) + 8px);
  padding-right: 12px; align-items: end;
  background: var(--surface); border: 1px solid var(--line); border-radius: 10px 10px 0 0;
  padding-block: 7px; font-size: 11.5px; font-weight: 500; color: var(--muted); line-height: 1.25;
}
.thead .nm { grid-column: 2; }
.thead .r { text-align: right; padding-left: 8px; }
.thead em { display: block; font-style: normal; font-size: 10.5px; opacity: .85; }

.list { background: var(--surface); border: 1px solid var(--line); border-top: 0; border-radius: 0 0 10px 10px; overflow: hidden; }
.grp {
  display: flex; justify-content: space-between; align-items: baseline;
  padding: 7px 12px; background: var(--accent-soft); border-bottom: 1px solid var(--line);
  font-size: 12.5px; color: var(--ink);
}
.grp b { font-weight: 700; }
.grp span { font: 400 11.5px var(--font-num); color: var(--muted); }

.store { border-bottom: 1px solid var(--line); }
.store:last-child { border-bottom: 0; }
.rowline { display: grid; grid-template-columns: 48px minmax(0, 1fr); }
.chk { width: 48px; height: 56px; border: 0; background: none; display: grid; place-items: center; cursor: pointer; padding: 0; }
.chk i { display: block; position: relative; width: 24px; height: 24px; border-radius: 50%; border: 2px solid var(--line-strong); }
.chk[aria-pressed="true"] i { background: var(--accent); border-color: var(--accent); }
.chk[aria-pressed="true"] i::after {
  content: ""; position: absolute; left: 6px; top: 2px; width: 6px; height: 11px;
  border: solid var(--accent-ink); border-width: 0 2.5px 2.5px 0; transform: rotate(45deg);
}
.main {
  display: grid; grid-template-columns: minmax(0, 1fr) var(--c1) var(--c2); column-gap: 8px; align-items: start;
  width: 100%; border: 0; background: none; text-align: left; cursor: pointer;
  padding: 10px 12px 11px 0;
}
.main > * { min-width: 0; }
.nm b { display: inline; font-size: 16.5px; line-height: 1.3; font-weight: 700; letter-spacing: -0.01em; }
.nm .chev { display: inline-block; vertical-align: -1px; margin-left: 4px; color: var(--muted); transition: transform .15s ease; }
.store.open .chev { transform: rotate(90deg); }
.nm small { display: block; margin-top: 1px; font-size: 12.5px; color: var(--muted); }
.v { text-align: right; font: 500 15px/1.3 var(--font-num); font-variant-numeric: tabular-nums; padding-top: 2px; }
.v small { font: 400 11px var(--font-body); margin-left: 1px; color: var(--muted); }
.bar { display: block; height: 4px; border-radius: 2px; background: var(--line); margin-top: 5px; overflow: hidden; }
.bar u { display: block; height: 100%; background: var(--accent); text-decoration: none; }
.until { grid-column: 1 / -1; margin-top: 6px; font-size: 12px; font-variant-numeric: tabular-nums; color: var(--muted); }
.pv {
  grid-column: 1 / -1; margin-top: 4px; font-size: 13px; line-height: 1.45; color: var(--muted);
  display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
}
.store.open .pv { display: none; }
.store.done .main > * { opacity: .55; }
.store.done .nm b { text-decoration: line-through; text-decoration-thickness: 1.5px; }
.store.open { background: color-mix(in srgb, var(--accent-soft) 35%, var(--surface)); }

.detail { padding: 2px 14px 16px 14px; border-top: 1px dashed var(--line); }
.detail h3 { margin: 14px 0 6px; font-size: 11.5px; font-weight: 700; letter-spacing: 0.04em; color: var(--muted); }
.notes { margin: 0; padding: 0; list-style: none; display: grid; gap: 6px; }
.notes li { position: relative; padding-left: 14px; font-size: 14.5px; line-height: 1.5; }
.notes li::before { content: ""; position: absolute; left: 1px; top: 0.7em; width: 6px; height: 2px; background: var(--accent); }
.facts { margin: 0; display: grid; grid-template-columns: repeat(auto-fit, minmax(148px, 1fr)); gap: 10px 14px; }
.facts div { min-width: 0; }
.facts dt { font-size: 11.5px; color: var(--muted); }
.facts dd { margin: 0; font-size: 14.5px; overflow-wrap: anywhere; }
.facts .wide { grid-column: 1 / -1; }
.money { margin: 0; display: grid; grid-template-columns: 1fr auto; gap: 7px 12px; padding: 10px 12px; background: var(--accent-soft); border-radius: 8px; }
.money dt { font-size: 12.5px; color: var(--muted); align-self: center; }
.money dd { margin: 0; text-align: right; font: 500 13.5px var(--font-num); font-variant-numeric: tabular-nums; overflow-wrap: anywhere; }
.money dd small { font: 400 11px var(--font-body); color: var(--muted); }

.empty { padding: 28px 16px; text-align: center; color: var(--muted); }
footer { margin-top: 16px; font-size: 12px; line-height: 1.6; color: var(--muted); }

@media (max-width: 359px) {
  .thead, .main { --c1: 54px; --c2: 66px; }
  .nm b { font-size: 15.5px; }
}
@media (prefers-reduced-motion: reduce) {
  .track u, .nm .chev { transition: none; }
}

  var MAXAVG = Math.max.apply(null, DATA.map(function (d) { return d.avg; }));
  DATA.forEach(function (d) {
    var p = d.end.split(".").map(Number);
    d.endMs = Date.UTC(p[0], p[1] - 1, p[2]);
    d.dday = Math.round((d.endMs - TODAY) / 86400000);
  });

  function won(n) { return n.toLocaleString("ko-KR") + "원"; }
  function eok(n) {
    if (n >= 1e8) return (n / 1e8).toFixed(2) + "<small>억</small>";
    if (n === 0) return "0";
    return Math.round(n / 1e4).toLocaleString("ko-KR") + "<small>만</small>";
  }
  function man1(n) { return (n / 1e4).toFixed(1); }
  function ddayText(d) {
    if (d.dday < 0) return (-d.dday) + "일 지남";
    if (d.dday === 0) return "오늘";
    return "D-" + d.dday;
  }
  function esc(s) {
    return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
  }

  var KEY = "pongdang-rounds-public-visited-v1";
  var state = { region: "전체", sort: "region", q: "", todo: false, open: {}, done: {} };
  try {
    var raw = localStorage.getItem(KEY);
    if (raw) JSON.parse(raw).forEach(function (n) { state.done[n] = true; });
  } catch (e) {}
  function save() {
    try { localStorage.setItem(KEY, JSON.stringify(Object.keys(state.done).map(Number))); } catch (e) {}
  }

  var SORTS = {
    region: function (a, b) { return REGION_ORDER.indexOf(a.region) - REGION_ORDER.indexOf(b.region) || a.n - b.n; },
    num: function (a, b) { return a.n - b.n; },
    avg: function (a, b) { return b.avg - a.avg; },
    s26: function (a, b) { return b.s26 - a.s26; },
    end: function (a, b) { return a.endMs - b.endMs; }
  };

  var elList = document.getElementById("list");
  var elRegions = document.getElementById("regions");
  var elFilters = document.getElementById("filters");

  function buildChips() {
    var rh = '<button type="button" class="chip" data-region="전체" aria-pressed="true">전체<span class="ct">' + DATA.length + '</span></button>';
    REGION_ORDER.forEach(function (r) {
      var c = DATA.filter(function (d) { return d.region === r; }).length;
      rh += '<button type="button" class="chip" data-region="' + r + '" aria-pressed="false">' + r + '<span class="ct">' + c + '</span></button>';
    });
    elRegions.innerHTML = rh;
    elFilters.innerHTML = '<button type="button" class="chip" data-todo="1" aria-pressed="false">미방문만 보기</button>';
  }
  function syncChips() {
    Array.prototype.forEach.call(elRegions.children, function (b) {
      b.setAttribute("aria-pressed", String(b.dataset.region === state.region));
    });
    Array.prototype.forEach.call(elFilters.children, function (b) {
      b.setAttribute("aria-pressed", String(state.todo));
    });
  }

  function detailHTML(d) {
    var memo = d.memo.length
      ? '<h3>메모</h3><ul class="notes">' + d.memo.map(function (t) { return '<li>' + esc(t) + '</li>'; }).join("") + '</ul>'
      : "";
    var facts = [
      ["사업 개시", d.start],
      ["계약 종료", d.end + " (" + ddayText(d) + ")"],
      ["운영방식", d.ops],
      ["POS", d.pos],
      ["매장 규모", d.py + "평 · " + d.fl + "층"],
      ["업종변경", d.change],
      ["사입", d.src + (d.items ? " · " + d.items : ""), "wide"]
    ].map(function (f) {
      return '<div' + (f[2] ? ' class="wide"' : '') + '><dt>' + f[0] + '</dt><dd>' + esc(f[1]) + '</dd></div>';
    }).join("");
    var money =
      '<dt>평당 월평균 (8~10월)</dt><dd>' + d.avg.toLocaleString("ko-KR") + '<small>원/평</small></dd>' +
      '<dt>2025년 총 매출</dt><dd>' + (d.s25 === 0 ? '0<small>원 · 2026 오픈</small>' : won(d.s25)) + '</dd>' +
      '<dt>2026년 총 매출 (10.31까지)</dt><dd>' + won(d.s26) + '</dd>' +
      '<dt>평당매출 (2026 누적)</dt><dd>' + d.pys.toLocaleString("ko-KR") + '<small>원/평</small></dd>';
    return memo +
      '<h3>기본 정보</h3><dl class="facts">' + facts + '</dl>' +
      '<h3>매출</h3><dl class="money">' + money + '</dl>';
  }

  function rowHTML(d) {
    var open = !!state.open[d.n], done = !!state.done[d.n];
    var pv = d.memo.length ? '<span class="pv">' + esc(d.memo.join(" · ")) + '</span>' : "";
    return '<article class="store' + (open ? " open" : "") + (done ? " done" : "") + '" data-n="' + d.n + '">' +
      '<div class="rowline">' +
        '<button type="button" class="chk" aria-pressed="' + done + '" aria-label="' + d.name + ' 방문 완료 표시"><i></i></button>' +
        '<button type="button" class="main" aria-expanded="' + open + '" aria-controls="dt' + d.n + '">' +
          '<span class="nm"><b>' + d.name + '</b>' +
            '<svg class="chev" viewBox="0 0 16 16" width="13" height="13" aria-hidden="true"><path d="M5.5 3.5 10 8l-4.5 4.5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>' +
            '<small>' + d.region + ' · ' + d.py + '평 · ' + d.fl + '층</small></span>' +
          '<span class="v">' + eok(d.s26) + '</span>' +
          '<span class="v">' + man1(d.avg) + '<i class="bar"><u style="width:' + Math.max(3, Math.round(d.avg / MAXAVG * 100)) + '%"></u></i></span>' +
          '<span class="until">' + d.ops + ' · 계약 ~' + d.end + '</span>' +
          pv +
        '</button>' +
      '</div>' +
      '<div class="detail" id="dt' + d.n + '"' + (open ? "" : " hidden") + '>' + detailHTML(d) + '</div>' +
    '</article>';
  }

  function visible() {
    var q = state.q.trim().toLowerCase();
    return DATA.filter(function (d) {
      if (state.region !== "전체" && d.region !== state.region) return false;
      if (q) {
        var hay = (d.name + " " + d.region + " " + d.memo.join(" ")).toLowerCase();
        if (hay.indexOf(q) < 0) return false;
      }
      if (state.todo && state.done[d.n]) return false;
      return true;
    }).sort(SORTS[state.sort]);
  }

  function render() {
    var rows = visible();
    if (!rows.length) {
      elList.innerHTML = '<div class="empty">조건에 맞는 매장이 없습니다.<br><button type="button" class="link" id="clear">조건 모두 지우기</button></div>';
      updateProgress();
      return;
    }
    var grouped = state.sort === "region" && state.region === "전체";
    var html = "", last = null;
    rows.forEach(function (d) {
      if (grouped && d.region !== last) {
        last = d.region;
        var g = rows.filter(function (x) { return x.region === d.region; });
        var dn = g.filter(function (x) { return state.done[x.n]; }).length;
        html += '<div class="grp"><b>' + d.region + '</b><span>' + g.length + '곳 · 방문 ' + dn + '/' + g.length + '</span></div>';
      }
      html += rowHTML(d);
    });
    elList.innerHTML = html;
    updateProgress();
  }

  function updateProgress() {
    var total = DATA.length;
    var done = DATA.filter(function (d) { return state.done[d.n]; }).length;
    document.getElementById("progText").textContent = "방문 " + done + " / " + total;
    document.getElementById("progFill").style.width = Math.round(done / total * 100) + "%";
  }

  elList.addEventListener("click", function (e) {
    if (e.target.id === "clear") {
      state.region = "전체"; state.q = ""; state.todo = false;
      document.getElementById("q").value = "";
      syncChips(); render();
      return;
    }
    var chk = e.target.closest(".chk");
    var main = e.target.closest(".main");
    if (chk) {
      var n = Number(chk.closest(".store").dataset.n);
      if (state.done[n]) delete state.done[n]; else state.done[n] = true;
      save(); render();
      return;
    }
    if (main) {
      var st = main.closest(".store");
      var id = Number(st.dataset.n);
      var willOpen = !state.open[id];
      if (willOpen) state.open[id] = true; else delete state.open[id];
      st.classList.toggle("open", willOpen);
      main.setAttribute("aria-expanded", String(willOpen));
      st.querySelector(".detail").hidden = !willOpen;
    }
  });

  elRegions.addEventListener("click", function (e) {
    var b = e.target.closest("[data-region]");
    if (!b) return;
    state.region = b.dataset.region;
    syncChips(); render();
  });
  elFilters.addEventListener("click", function (e) {
    if (!e.target.closest("[data-todo]")) return;
    state.todo = !state.todo;
    syncChips(); render();
  });
  document.getElementById("q").addEventListener("input", function (e) { state.q = e.target.value; render(); });
  document.getElementById("sort").addEventListener("change", function (e) { state.sort = e.target.value; render(); });

  var resetBtn = document.getElementById("reset"), resetTimer = null;
  resetBtn.addEventListener("click", function () {
    if (!Object.keys(state.done).length) return;
    if (resetBtn.dataset.armed) {
      state.done = {}; save(); render();
      resetBtn.textContent = "방문 초기화"; delete resetBtn.dataset.armed;
      clearTimeout(resetTimer);
    } else {
      resetBtn.dataset.armed = "1";
      resetBtn.textContent = "한 번 더 누르면 초기화";
      resetTimer = setTimeout(function () {
        resetBtn.textContent = "방문 초기화"; delete resetBtn.dataset.armed;
      }, 3500);
    }
  });

  buildChips();
  syncChips();
  render();
})();
</script>
</body>
</html>
